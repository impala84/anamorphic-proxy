[package]
name = "deproxy"
version = "0.2.0"
description = "Hardware-accelerated anamorphic proxy generator for macOS"
authors = ["DeProxy contributors"]
license = "MIT"
repository = "https://github.com/impala84/anamorphic-proxy"
edition = "2021"

[lib]
name = "deproxy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
